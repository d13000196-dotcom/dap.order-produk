<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DASHBOARD ADMIN - DAP ORDER</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--main:#FFDE59;--bg:#F2EFFF}
*{box-sizing:border-box}body{margin:0;font-family:Inter;background:var(--bg);background-image:linear-gradient(#0000000e 1px,transparent 1px),linear-gradient(90deg,#0000000e 1px,transparent 1px);background-size:26px 26px;padding-bottom:88px}
.header{position:sticky;top:0;height:64px;background:var(--main);border-bottom:4px solid #000;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.btn-dap{border:3.5px solid #000;background:#fff;border-radius:18px;padding:10px 14px;font-family:'Bricolage Grotesque';font-weight:900;box-shadow:4px 4px 0 #000}
.card{margin:14px 12px;background:#fff;border:3.5px solid #000;border-radius:20px;padding:16px;box-shadow:6px 6px 0 #000;animation:revealPop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes revealPop{0%{opacity:0;transform:scale(.92) translateY(15px);filter:blur(8px)}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 12px}
.stat div{background:#fff;border:3.5px solid #000;border-radius:18px;padding:14px;box-shadow:5px 5px 0 #000}
.stat b{font-family:'Bricolage Grotesque';font-size:26px}
.btn{border:3.5px solid #000;border-radius:999px;padding:12px;font-family:'Bricolage Grotesque';font-weight:900;box-shadow:4px 4px 0 #000;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="header"><div class="btn-dap">☰ DAP ORDER</div><div style="font-family:'Bricolage Grotesque';font-weight:900">ADMIN</div></div>
<div style="margin:14px 12px"><h1 style="font-family:'Bricolage Grotesque';font-weight:900;font-size:28px;margin:0">DASHBOARD ADMIN</h1><p style="margin:6px 0 0;color:#555">Halo, Admin. Kelola produk, testi & kontak dari sini.</p></div>
<div class="stat"><div><div style="font-size:12px;color:#888;font-weight:800">TOTAL PRODUK</div><b id="totalProduk">7</b><div style="font-size:12px">Produk aktif</div></div><div style="background:#C9F1DF"><div style="font-size:12px;color:#555;font-weight:800">DATABASE</div><b style="font-size:18px">Terhubung</b><div style="font-size:12px">DAP ORDER</div></div></div>
<div class="card"><h3 style="font-family:'Bricolage Grotesque';margin:0">AGENT MANAJEMEN</h3><p style="color:#666;font-size:13px">Kelola produk & testi. Data tersimpan di browser (localStorage) untuk demo ini.</p>
<label style="font-weight:900;font-size:12px">NAMA PRODUK BARU</label><input id="newName" placeholder="Contoh: Netflix Premium" style="width:100%;border:3px solid #000;border-radius:12px;padding:12px;margin:6px 0">
<label style="font-weight:900;font-size:12px">HARGA</label><input id="newPrice" placeholder="Contoh: Rp 50.000" style="width:100%;border:3px solid #000;border-radius:12px;padding:12px;margin:6px 0">
<button class="btn" style="background:var(--main)" onclick="addProduct()">+ TAMBAH PRODUK (DEMO)</button>
<div id="listProduk" style="margin-top:12px;font-size:13px"></div>
<button class="btn" style="background:#FFE3C2" onclick="location.href='produk.html'">LIHAT KATALOG</button>
<button class="btn" style="background:#FFDE59" onclick="location.href='testi.html'">KELOLA TESTI</button>
<button class="btn" style="background:#FF8A1A;color:#fff" onclick="logout()">LOGOUT</button>
</div>
<script>
if(sessionStorage.getItem('dap_admin')!=='1'){ location.href='login.html' }
let list=JSON.parse(localStorage.getItem('dap_products')||'[]');
function render(){ document.getElementById('listProduk').innerHTML=list.length?list.map((x,i)=>`<div style="border:2px solid #000;border-radius:12px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between"><span><b>${x.name}</b><br>${x.price}</span><span onclick="del(${i})" style="cursor:pointer">✕</span></div>`).join(''):'<div style="color:#888">Belum ada produk tambahan.</div>'; document.getElementById('totalProduk').innerText=7+list.length }
function addProduct(){const n=document.getElementById('newName').value.trim(); const p=document.getElementById('newPrice').value.trim(); if(!n||!p) return alert('Isi nama + harga dulu'); list.push({name:n,price:p}); localStorage.setItem('dap_products',JSON.stringify(list)); document.getElementById('newName').value=''; document.getElementById('newPrice').value=''; render()}
function del(i){list.splice(i,1); localStorage.setItem('dap_products',JSON.stringify(list)); render()}
function logout(){sessionStorage.removeItem('dap_admin'); location.href='login.html'}
render()
</script>
</body>
</html>
