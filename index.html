<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--kuning:#FFDE59;--bg:#F2EFFF}
body{margin:0; background:var(--bg); font-family:Inter, sans-serif; background-image:linear-gradient(#0000000c 1px, transparent 1px), linear-gradient(90deg, #0000000c 1px, transparent 1px); background-size:26px 26px}
.h{position:sticky; top:0; background:var(--kuning); border-bottom:3.5px solid #000; height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 12px}
.b{border:3.5px solid #000; background:#fff; border-radius:16px; padding:8px 14px; font-weight:900; box-shadow:4px 4px 0 #000; cursor:pointer}
.badge{background:var(--kuning); border:3px solid #000; font-weight:900; font-size:12px; padding:5px 10px; transform:rotate(-1deg); box-shadow:3px 3px 0 #000; margin:18px 12px}
.judul{font-weight:900; font-size:46px; line-height:0.9; padding:0 12px; letter-spacing:-2px}
.stiker{background:#fff; border:3.5px solid #000; color:#B45309; padding:4px 12px; transform:rotate(1.5deg); box-shadow:6px 6px 0 #000; display:inline-block; margin:8px 0}
.btn{margin:16px 12px; background:#000; color:#fff; border:3px solid #000; border-radius:99px; padding:14px 20px; font-weight:900; display:flex; gap:8px; box-shadow:4px 4px 0 #000}
.mint{margin-top:20px; background:#C7F2DD; border-top:3.5px solid #000; border-bottom:3.5px solid #000; padding:16px 12px}
.card{border:3.5px solid #000; background:#fff; border-radius:14px; padding:14px; margin-top:10px; display:flex; justify-content:space-between; font-weight:700; box-shadow:4px 4px 0 #000}
.nav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:3.5px solid #000; display:flex; gap:8px; padding:8px}
.nav div{flex:1; border:3px solid #000; border-radius:12px; padding:10px; text-align:center; font-weight:900; font-size:11px; box-shadow:3px 3px 0 #000}
.nav .on{background:var(--kuning)}
</style>
</head>
<body>

<div class="h">
  <button class="b">☰ DAP ORDER</button>
  <button class="b" onclick="document.getElementById('warna').style.display=document.getElementById('warna').style.display=='flex'?'none':'flex'">🎨</button>
</div>

<div id="warna" style="display:none; position:absolute; top:62px; right:12px; background:#fff; border:3.5px solid #000; border-radius:16px; padding:10px; gap:8px; box-shadow:6px 6px 0 #000; z-index:10">
  <div onclick="document.documentElement.style.setProperty('--kuning','#FFDE59')" style="width:32px; height:32px; background:#FFDE59; border:3px solid #000; border-radius:8px; box-shadow:2px 2px 0 #000"></div>
  <div onclick="document.documentElement.style.setProperty('--kuning','#8AB8FF')" style="width:32px; height:32px; background:#8AB8FF; border:3px solid #000; border-radius:8px; box-shadow:2px 2px 0 #000"></div>
  <div onclick="document.documentElement.style.setProperty('--kuning','#8AFF9E')" style="width:32px; height:32px; background:#8AFF9E; border:3px solid #000; border-radius:8px; box-shadow:2px 2px 0 #000"></div>
  <div onclick="document.documentElement.style.setProperty('--kuning','#FF8A8A')" style="width:32px; height:32px; background:#FF8A8A; border:3px solid #000; border-radius:8px; box-shadow:2px 2px 0 #000"></div>
</div>

<div class="badge">PRODUCT & TESTIMONI</div>

<div class="judul">
BERBAGAI<br>
<div class="stiker">PRODUCT</div><br>
APLIKASI<br>PREMIUM
</div>

<div style="padding:12px; font-size:14px; color:#444; line-height:1.5">
Produk digital premium, garansi, fast respon. Simpel, aman, no ribet.
</div>

<button class="btn">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M9 8 h10 l-2 8 H7 L5 4 H2"/></svg>
  JELAJAHI PRODUCT
</button>

<div class="mint">
  <div style="background:var(--kuning); border:3px solid #000; display:inline-flex; padding:6px 10px; font-weight:900; font-size:12px; box-shadow:3px 3px 0 #000; transform:rotate(-1deg)">● FALL REAL</div>
  <div style="margin-top:12px; font-size:13px; line-height:1.5; font-weight:600">Tempat menjelajahi produk digital. Cek detail sebelum beli.</div>
  
  <div style="margin-top:16px; background:#C7F2DD; border:3px solid #000; display:inline-block; padding:8px 12px; font-weight:900; box-shadow:3px 3px 0 #000">INFORMASI</div>
  <div class="card">Jelajahi Product <span>↗</span></div>
  <div class="card" style="background:#C8E6FF">Tutorial Membeli <span>→</span></div>
  <div class="card" style="background:var(--kuning)">Aturan Jual Beli <span>→</span></div>
</div>

<div class="nav">
  <div class="on">HOME</div>
  <div>PRODUCT</div>
  <div>TESTI</div>
  <div>CONTACT</div>
</div>

</body>
</html>
